const START='2026-08-31',END='2026-12-20',KEY='university-os-v1-2026';const courseMeta=[['calculus','미적분 II',40,'#5c9a7c'],['discrete','이산수학',35,'#84a7c9'],['logic','논리적 사고',15,'#ae9dc5'],['english','영어쓰기',10,'#d6a082'],['other','기타',0,'#a0aaa3']];const baseTasks=[{id:'dlecture',title:'이산수학 온라인 강의 시청',course:'discrete',weekday:0},{id:'clecture',title:'미적분 온라인 강의 완료',course:'calculus',weekday:6},{id:'llecture',title:'논리적 사고 온라인 강의 완료',course:'logic',weekday:6},{id:'cweb',title:'미적분 WebWork 제출',course:'calculus',weekday:6},{id:'dweb',title:'이산수학 WebWork 제출',course:'discrete',weekday:6},{id:'creview',title:'미적분 예제·복습',course:'calculus',weekday:2},{id:'dreview',title:'이산수학 복습·증명 연습',course:'discrete',weekday:3},{id:'ereview',title:'영어쓰기 수업 내용 정리',course:'english',weekday:1},{id:'weekly',title:'주간 오답·학습 계획 점검',course:'other',weekday:6}];const milestones=[['2026-11-08','학습 루틴 정착 및 밀린 진도 해소'],['2026-11-22','미적분·이산 주요 유형 스스로 해결'],['2026-11-29','기말 범위 1회독 마무리 시작'],['2026-12-06','4과목 시험 범위 1회독 완료'],['2026-12-10','미적분·이산 실전 문제풀이 완료'],['2026-12-13','전 과목 최종 오답 정리 완료']];const navs=[['home','⌂','Home'],['tasks','☑','Tasks'],['calendar','▦','Calendar'],['courses','▤','Courses'],['finals','◎','Finals']];let state={completed:{},custom:[],milestones:{}};try{const parsed=JSON.parse(localStorage.getItem(KEY));if(parsed && typeof parsed==='object')state={...state,...parsed}}catch(e){}let page='home',dayFocus=asDate(new Date()),monthFocus=asDate(new Date()).slice(0,7),taskFilter='all';const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function asDate(v){return typeof v==='string'?v:localDate(v)}function parse(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}function add(s,n){const d=parse(s);d.setDate(d.getDate()+n);return localDate(d)}function weekday(s){return (parse(s).getDay()+6)%7}function monday(s){return add(s,-weekday(s))}function weekNo(s){return Math.floor((parse(monday(s))-parse(START))/604800000)+1}function validSemester(s){return s>=START&&s<=END}function short(s){return s.slice(5).replace('-','/')}function pretty(s){return `${Number(s.slice(5,7))}월 ${Number(s.slice(8))}일`}function today(){return localDate(new Date())}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function weekDates(s){const m=monday(s);return Array.from({length:7},(_,i)=>add(m,i))}function getTasks(start,end){let out=[];for(let s=start;s<=end;s=add(s,1)){if(validSemester(s)){for(const t of baseTasks)if(weekday(s)===t.weekday)out.push({...t,date:s,uid:t.id+'@'+s,recurring:true})}for(const t of state.custom||[]){if(t.repeat==='weekly'){if(s>=t.date&&weekday(s)===weekday(t.date))out.push({...t,date:s,uid:t.id+'@'+s})}else if(t.date===s)out.push({...t,uid:t.id+'@'+s})}}return out.sort((a,b)=>a.date.localeCompare(b.date))}function completed(t){return !!state.completed[t.uid]}function toggle(uid,checked){state.completed[uid]=checked;save();render()}function meta(id){return courseMeta.find(x=>x[0]===id)||courseMeta[4]}function taskHTML(t){return `<div class="task ${completed(t)?'done':''}"><input type="checkbox" aria-label="${esc(t.title)} 완료" ${completed(t)?'checked':''} onchange="toggle('${esc(t.uid)}',this.checked)"><div class="task-body"><div class="task-title">${esc(t.title)}</div><div class="due">${pretty(t.date)} · ${esc(meta(t.course)[1])}${t.repeat==='weekly'||t.recurring?' · 매주 반복':''}</div></div><span class="tag">${esc(meta(t.course)[1])}</span>${!t.recurring?`<button class="del" title="삭제" onclick="deleteTask('${esc(t.id)}')">×</button>`:''}</div>`}function listHTML(tasks,limit){const a=limit?tasks.slice(0,limit):tasks;return a.length?a.map(taskHTML).join(''):'<div class="empty">할 일이 없습니다. 새로운 할 일을 추가해 보세요.</div>'}function progress(tasks){return tasks.length?Math.round(100*tasks.filter(completed).length/tasks.length):0}function bar(p){return `<div class="bar"><span style="width:${p}%"></span></div>`}function header(title,desc){return `<header class="top"><div><div class="eyebrow">UNIVERSITY OS / FALL 2026</div><h1 class="page-title">${title}</h1><div class="sub">${desc}</div></div><div class="pill">${Math.max(1,Math.min(16,weekNo(today())))}주차 · 16주 학기</div></header>`}function cardTitle(t,link){return `<div class="section-title"><h2>${t}</h2>${link?`<button class="action secondary smallbtn" onclick="go('${link}')">전체 보기 →</button>`:''}</div>`}function home(){const t=today(),wk=weekDates(t),all=getTasks(wk[0],wk[6]),td=all.filter(x=>x.date===t),pending=all.filter(x=>!completed(x)),soon=getTasks(t,add(t,7)).filter(x=>!completed(x)),p=progress(all);return header('Good to see you.','오늘의 할 일부터 기말고사까지, 한 곳에서 관리하세요.')+`<section class="hero"><div class="eyebrow">YOUR SEMESTER, IN FOCUS</div><h2>매일 조금씩, 기말은 여유롭게.</h2><p>12월 14일 시작하는 기말고사 주간까지 계획을 이어가요. 가장 중요한 건 이번 주의 작은 약속을 지키는 것입니다.</p><button class="action" onclick="go('tasks')">오늘 할 일 확인 →</button></section><div class="stats"><div class="stat"><small>이번 주 완료율</small><strong>${p}%</strong>${bar(p)}</div><div class="stat"><small>이번 주 남은 일</small><strong>${pending.length}</strong><small>개</small></div><div class="stat"><small>기말 시작까지</small><strong>${Math.max(0,Math.ceil((parse('2026-12-14')-parse(t))/86400000))}</strong><small>일</small></div></div><div class="grid"><section class="panel">${cardTitle('오늘의 할 일','tasks')}<div class="tasks">${listHTML(td)}</div><button class="action secondary smallbtn section" onclick="openModal('${t}')">+ 할 일 추가</button></section><section class="panel">${cardTitle('다가오는 마감','calendar')}<div class="tasks">${listHTML(soon,5)}</div></section></div><div class="section panel">${cardTitle('Semester roadmap','finals')}<div class="weeks">${Array.from({length:8},(_,i)=>{const w=i+9;return `<div class="week ${weekNo(t)===w?'now':weekNo(t)>w?'past':w===16?'finals':''}">WEEK<strong>${w}</strong></div>`}).join('')}</div><p class="small muted" style="margin-bottom:0">8/31 개강 · 12/14~12/20 기말고사(16주차)</p></div>`}
function tasksPage(){const wd=weekDates(dayFocus),arr=getTasks(wd[0],wd[6]);const filtered=taskFilter==='all'?arr:taskFilter==='pending'?arr.filter(x=>!completed(x)):arr.filter(x=>x.course===taskFilter);return header('Tasks','강의와 WebWork는 매주 자동으로 생성됩니다. 체크는 주차별로 따로 저장됩니다.')+`<section class="panel"><div class="row between" style="margin-bottom:18px;flex-wrap:wrap"><div class="row"><button class="action ghost smallbtn" onclick="moveWeek(-1)">←</button><b>${pretty(wd[0])} – ${pretty(wd[6])}</b><button class="action ghost smallbtn" onclick="moveWeek(1)">→</button></div><button class="action smallbtn" onclick="openModal('${dayFocus}')">+ 새 할 일</button></div><div class="row between" style="margin-bottom:9px"><span class="muted small">${arr.filter(completed).length}/${arr.length} 완료</span><span class="muted small">${progress(arr)}%</span></div>${bar(progress(arr))}<div class="tabs section">${[['all','전체'],['pending','미완료'],...courseMeta.map(x=>[x[0],x[1]])].map(x=>`<button class="${taskFilter===x[0]?'selected':''}" onclick="filterTasks('${x[0]}')">${x[1]}</button>`).join('')}</div>${wd.map(s=>{const ts=filtered.filter(x=>x.date===s);return `<div class="weekly-day">${['월','화','수','목','금','토','일'][weekday(s)]}요일 · ${pretty(s)} ${s===today()?'· 오늘':''}</div><div class="tasks">${listHTML(ts)}</div>`}).join('')}</section>`}function monthDays(m){const f=m+'-01',day=weekday(f),n=new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate();return Array.from({length:Math.ceil((day+n)/7)*7},(_,i)=>add(f,i-day))}function calendarPage(){const days=monthDays(monthFocus),m=monthFocus;return header('Calendar','학기 중 강의·과제·시험 목표를 날짜별로 확인하세요.')+`<div class="split" style="grid-template-columns:1.5fr 1fr"><section class="panel"><div class="row between" style="margin-bottom:20px"><h2 style="margin:0">${Number(m.slice(0,4))}년 ${Number(m.slice(5))}월</h2><div class="row"><button class="action ghost smallbtn" onclick="moveMonth(-1)">←</button><button class="action ghost smallbtn" onclick="moveMonth(1)">→</button></div></div><div class="calendarhead">${['월','화','수','목','금','토','일'].map(x=>`<span>${x}</span>`).join('')}</div><div class="weekday-grid">${days.map(s=>{const tasks=getTasks(s,s);return `<button onclick="chooseDay('${s}')" class="daycell ${s.slice(0,7)!==m?'dim':''} ${s===dayFocus?'selected':''} ${s===today()?'today':''}"><span class="num">${Number(s.slice(8))}</span>${tasks.slice(0,2).map(x=>`<span class="dotline">${completed(x)?'✓':'•'} ${esc(x.title)}</span>`).join('')}${tasks.length>2?`<span class="dotline">+${tasks.length-2}</span>`:''}</button>`}).join('')}</div></section><section class="panel"><div class="row between" style="margin-bottom:13px"><h2 style="margin:0">${pretty(dayFocus)}의 일정</h2><button class="action smallbtn" onclick="openModal('${dayFocus}')">+ 추가</button></div><div class="tasks">${listHTML(getTasks(dayFocus,dayFocus))}</div>${milestones.filter(x=>x[0]===dayFocus).map(x=>`<div class="callout section">기말 목표 · ${esc(x[1])}</div>`).join('')}</section></div>`}function coursesPage(){return header('Courses','과목별 수업 패턴과 시험 대비 시간을 관리합니다.')+`<div class="split">${courseMeta.slice(0,4).map(x=>`<section class="panel"><div class="row between"><h2 style="margin:0">${x[1]}</h2><span class="badge">공부 비중 ${x[2]}%</span></div><div class="section" style="height:8px;background:var(--line);border-radius:10px;overflow:hidden"><div style="height:100%;background:${x[3]};width:${x[2]}%"></div></div><p class="sub">${{calculus:'월: 오프라인 수업(전주 온라인 강의 내용) · 새 강의 공개 / 일: 온라인 강의 및 WebWork 마감',discrete:'월 오후: 온라인 강의 / 화: 오프라인 수업 / 일: WebWork 마감',logic:'월: 온라인 강의 공개 / 일: 시청 마감',english:'화: 오프라인 수업 / 비정기 과제'}[x[0]]}</p><button class="action secondary smallbtn" onclick="go('tasks','${x[0]}')">할 일 보기 →</button></section>`).join('')}</div><div class="panel section"><h2>학습 시간 배분 원칙</h2><p class="sub">강의 시청과 필수 과제에 드는 시간을 제외하고, 추가 기말 공부 시간은 미적분 40%, 이산수학 35%, 논리적 사고 15%, 영어쓰기 10%를 기본으로 합니다. 과제 주간에는 유연하게 조정하세요.</p></div>`}function finalsPage(){const t=today(),w=weekNo(t),phases=[['8주차 · 10/19~10/25','중간고사 취약점 점검 및 학습 기반 정비'],['9~10주차 · 10/26~11/8','개념 복구 + 새로운 강의 진도 누적 방지'],['11~12주차 · 11/9~11/22','응용 문제와 증명 연습 심화'],['13~14주차 · 11/23~12/6','기말 범위 1회독 완료 + 실전 연습'],['15주차 · 12/7~12/13','기출·모의고사·오답 집중'],['16주차 · 12/14~12/20','기말고사']];return header('Finals roadmap','기말고사 시작: 2026년 12월 14일 · 16주차')+`<section class="hero"><div class="eyebrow">FINAL EXAMS · 4 COURSES</div><h2>기말까지 ${Math.max(0,Math.ceil((parse('2026-12-14')-parse(t))/86400000))}일</h2><p>미적분·이산수학을 중심으로 매주 강의와 문제풀이를 병행하세요. 시험 직전에는 새 개념보다 실전 연습에 집중합니다.</p></section><div class="split section"><section class="panel"><h2>주차별 전략</h2>${phases.map((p,i)=>`<div class="milestone"><span style="font-weight:700;color:var(--green);min-width:145px">${p[0]}</span><span>${p[1]}</span></div>`).join('')}</section><section class="panel"><h2>핵심 마일스톤</h2>${milestones.map((m,i)=>`<label class="milestone"><input type="checkbox" ${state.milestones[i]?'checked':''} onchange="toggleMilestone(${i},this.checked)"><time>${pretty(m[0])}</time><span style="${state.milestones[i]?'text-decoration:line-through;color:#9ba99f':''}">${m[1]}</span></label>`).join('')}</section></div>`}function render(){const panel={home,tasks:tasksPage,calendar:calendarPage,courses:coursesPage,finals:finalsPage};$('content').innerHTML=page==='settings'?settingsPage():panel[page]();$('nav').innerHTML=navs.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span><span class="label">${x[2]}</span></button>`).join('')+'<div class="tiny" style="margin-top:18px">PREFERENCES</div><button class="'+(page==='settings'?'active':'')+'" onclick="go(\'settings\')"><span class="ico">⚙</span><span class="label">Settings</span></button>';$('mobileNav').innerHTML=navs.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');if(page==='settings')$('content').innerHTML=settingsPage()}function go(p,filter){page=p;if(filter)taskFilter=filter;render();window.scrollTo(0,0)}function moveWeek(n){dayFocus=add(dayFocus,n*7);render()}function moveMonth(n){const[y,m]=monthFocus.split('-').map(Number);const d=new Date(y,m-1+n,1);monthFocus=localDate(d).slice(0,7);render()}function chooseDay(s){dayFocus=s;render()}function filterTasks(f){taskFilter=f;render()}function openModal(date){$('newTitle').value='';$('newCourse').innerHTML=courseMeta.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('newDate').value=date||today();$('newRepeat').value='none';$('modal').classList.add('open');$('newTitle').focus()}function closeModal(){$('modal').classList.remove('open')}function deleteTask(id){if(!confirm('이 할 일을 삭제할까요? 반복 할 일이라면 이후 일정에서도 사라집니다.'))return;state.custom=state.custom.filter(x=>x.id!==id);save();render()}function toggleMilestone(i,v){state.milestones[i]=v;save();render()}$('taskForm').addEventListener('submit',e=>{e.preventDefault();state.custom.push({id:'custom'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:$('newTitle').value.trim(),course:$('newCourse').value,date:$('newDate').value,repeat:$('newRepeat').value});save();closeModal();render()});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});function settingsPage(){return header('Settings','내 데이터의 보관과 백업을 관리합니다.')+`<div class="panel" style="max-width:740px"><h2>데이터 저장 방식</h2><p class="sub">현재 버전은 이 브라우저의 로컬 저장소에 완료 상태와 추가한 할 일을 저장합니다. 같은 사이트라도 다른 기기나 브라우저에는 자동 동기화되지 않습니다. 데이터가 사라지지 않도록 정기적으로 백업 파일을 내보내세요.</p><div class="row" style="flex-wrap:wrap;margin-top:20px"><button class="data-button" onclick="exportData()">↓ JSON 백업 저장</button><label class="data-button">↑ JSON 백업 불러오기<input type="file" style="display:none" accept="application/json" onchange="importData(event)"></label></div><div class="callout section">다음 단계: 계정 로그인, 실제 클라우드 동기화, 기존 Daily Planner/Notion Tasks 연동, 개인 일정 통합. 현재 버전에는 구현되어 있지 않습니다.</div></div>`}function exportData(){const blob=new Blob([JSON.stringify({version:1, if(!state.baseEdits)state.baseEdits={};
if(!state.taskExceptions)state.taskExceptions={};
let editingTaskId=null;
// Normalize pre-existing browser schedules: two meetings share one subject.
for(const item of state.schedule){if(item.id==='academic_thu')item.courseId='academic';if(item.id==='english_thu')item.courseId='english';}
function activeSchedule(){return state.schedule||defaultSchedule}
classSchedule.splice(0,classSchedule.length,...activeSchedule());
function syncSchedule(){classSchedule.splice(0,classSchedule.length,...activeSchedule());save()}
function editClass(id){
 const c=activeSchedule().find(x=>x.id===id);
 const n=prompt('수업 이름',c?.name||'');if(n===null||!n.trim())return;
 const day=prompt('요일 (월=0, 화=1, 수=2, 목=3, 금=4)',c?.day??0);if(day===null)return;
 const d=Number(day);if(!Number.isInteger(d)||d<0||d>4){alert('요일은 0~4로 입력하세요.');return}
 const start=prompt('시작 시간 (HH:MM)',c?.start||'09:00');if(start===null)return;
 const end=prompt('종료 시간 (HH:MM)',c?.end||'10:15');if(end===null)return;
 if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(end)||end<=start){alert('시간을 HH:MM 형식으로 입력하고 종료 시간이 시작보다 늦게 설정하세요.');return}
 const room=prompt('강의실 (선택)',c?.room||'');if(room===null)return;
 const updated={id:c?.id||('course'+Date.now()),name:n.trim(),day:d,start,end,room,color:c?.color||'#7cab91',...(c?.courseId?{courseId:c.courseId}:{})};
 if(c)state.schedule=activeSchedule().map(x=>x.id===id?updated:x);else state.schedule=[...activeSchedule(),updated];
 syncSchedule();render();
}
function removeClass(id){if(!confirm('시간표에서 이 수업을 삭제할까요? 기존 수업 일지 기록은 유지됩니다.'))return;state.schedule=activeSchedule().filter(x=>x.id!==id);syncSchedule();render()}
const priorTimetablePage=timetablePage;
timetablePage=function(){
 let html=priorTimetablePage();
 const edits=`<section class="panel section"><div class="row between" style="flex-wrap:wrap;gap:12px"><div><h2 style="margin:0">내 시간표 편집</h2><p class="muted small">요일·시각·강의실을 변경할 수 있습니다. 온라인 강의와 과제는 Tasks에서 관리합니다.</p></div><button class="action smallbtn" onclick="editClass(null)">+ 수업 추가</button></div>${activeSchedule().slice().sort((a,b)=>a.day-b.day||a.start.localeCompare(b.start)).map(c=>`<div class="material-entry"><div><b>${esc(c.name)}</b><br><small class="muted">${['월','화','수','목','금'][c.day]} ${esc(c.start)}–${esc(c.end)} · ${esc(c.room||'강의실 미지정')}</small></div><div class="row"><button class="action ghost smallbtn" onclick="editClass('${esc(c.id)}')">수정</button><button class="del" title="삭제" onclick="removeClass('${esc(c.id)}')">×</button></div></div>`).join('')}<button class="action ghost smallbtn" onclick="restoreSchedule()">기본 시간표로 초기화</button></section>`;
 return html+edits;
};
function restoreSchedule(){if(!confirm('시간표를 초기 수업 정보로 되돌릴까요?'))return;state.schedule=defaultSchedule.map(c=>({...c}));syncSchedule();render()}
function effectiveBase(){return baseTasks.filter(t=>!state.baseEdits[t.id]?.deleted).map(t=>({...t,...(state.baseEdits[t.id]||{})}))}
getTasks=function(start,end){let out=[];for(let s=start;s<=end;s=add(s,1)){
 if(validSemester(s))for(const t of effectiveBase())if(weekday(s)===t.weekday){const uid=t.id+'@'+s;if(state.taskExceptions[uid]?.deleted)continue;out.push({...t,...(state.taskExceptions[uid]||{}),date:s,uid,recurring:true,base:true})}
 for(const t of state.custom||[]){const rule=t.repeat||'none';let matched=false;if(s>=t.date){if(rule==='daily')matched=true;else if(rule==='weekly')matched=weekday(s)===weekday(t.date);else if(rule==='monthly')matched=parse(s).getDate()===parse(t.date).getDate();else matched=s===t.date}
 if(matched){const uid=t.id+'@'+s;if(state.taskExceptions[uid]?.deleted)continue;out.push({...t,...(state.taskExceptions[uid]||{}),date:s,uid,recurring:rule!=='none'})}}
 }return out.sort((a,b)=>a.date.localeCompare(b.date))};
taskHTML=function(t){return `<div class="task ${completed(t)?'done':''}"><input type="checkbox" aria-label="${esc(t.title)} 완료" ${completed(t)?'checked':''} onchange="toggle('${esc(t.uid)}',this.checked)"><div class="task-body"><div class="task-title">${esc(t.title)}</div><div class="due">${pretty(t.date)} · ${esc(meta(t.course)[1])}${t.repeat&&t.repeat!=='none'||t.recurring?' · 반복':''}</div></div><span class="tag">${esc(meta(t.course)[1])}</span><button class="action ghost smallbtn" onclick="editTask('${esc(t.uid)}')">수정</button><button class="del" title="삭제" onclick="deleteTaskInstance('${esc(t.uid)}')">×</button></div>`};
function findTask(uid){const date=uid.split('@').at(-1);return getTasks(date,date).find(t=>t.uid===uid)}
function editTask(uid){const t=findTask(uid);if(!t)return;editingTaskId=uid;openModal(t.date);$('newTitle').value=t.title;$('newCourse').value=t.course;$('newDate').value=t.date;$('newRepeat').value=t.base?'weekly':(t.repeat||'none');$('taskForm').querySelector('[type="submit"]').textContent='수정 저장';$('taskModalTitle').textContent='할 일 수정';$('newRepeat').disabled=!!t.base;}
const prevOpenModal=openModal;
openModal=function(date){editingTaskId=null;prevOpenModal(date);$('taskForm').querySelector('[type="submit"]').textContent='추가하기';$('taskModalTitle').textContent='새 할 일 추가';$('newRepeat').disabled=false;};
function deleteTaskInstance(uid){const t=findTask(uid);if(!t)return;let one=true;if(t.recurring){one=confirm('이번 회차만 삭제하려면 확인, 반복 전체를 삭제하려면 취소를 선택하세요.');if(!one&&!confirm('반복 전체를 삭제할까요?'))return;}else if(!confirm('할 일을 삭제할까요?'))return;
 if(one){state.taskExceptions[uid]={...(state.taskExceptions[uid]||{}),deleted:true}}
 else if(t.base){state.baseEdits[t.id]={...(state.baseEdits[t.id]||{}),deleted:true}}
 else state.custom=state.custom.filter(x=>x.id!==t.id);
 save();render();}
// Replace old submit handler by capturing it before it runs; keeps the original add pathway.
$('taskForm').addEventListener('submit',function(e){if(!editingTaskId)return;e.preventDefault();e.stopImmediatePropagation();const uid=editingTaskId,t=findTask(uid);if(!t)return;
 const patch={title:$('newTitle').value.trim(),course:$('newCourse').value};if(!patch.title)return;
 if(t.base){state.baseEdits[t.id]={...(state.baseEdits[t.id]||{}),...patch};}
 else {state.custom=state.custom.map(x=>x.id===t.id?{...x,...patch,date:$('newDate').value,repeat:$('newRepeat').value}:x);}
 save();editingTaskId=null;closeModal();render();},true);
const prevMaterialsPage=materialsPage;
materialsPage=function(){return prevMaterialsPage().replaceAll('title="링크 제거"','title="링크 제거"').replace(/(<a href="[^\"]+" target="_blank" rel="noopener noreferrer">Drive 열기 ↗<\/a>)(<button class="del" onclick="removeMaterial\('([^']+)'\)" title="링크 제거">)/g,(_full,link,btn,id)=>link+`<button class="action ghost smallbtn" onclick="editMaterial('${id}')">수정</button>`+btn)};
function editMaterial(id){const m=state.materials.find(x=>String(x.id)===String(id));if(!m)return;const name=prompt('자료 이름',m.name);if(name===null||!name.trim())return;const url=prompt('Google Drive 링크',m.url);if(url===null||safeURL(url)==='#'){alert('올바른 링크를 입력해 주세요.');return}const course=prompt('과목 ID ('+uniqueCourses().map(x=>x.id).join(', ')+')',m.course);if(course===null)return;m.name=name.trim();m.url=url.trim();m.course=course.trim()||m.course;save();render()}


// Phase 2.4: daily / weekly Tasks without altering stored task records.
let taskPeriodMode='today';
function chooseTaskPeriod(mode){taskPeriodMode=mode; if(mode==='today')dayFocus=today();render()}
function shiftTaskPeriod(n){dayFocus=add(dayFocus,taskPeriodMode==='today'?n:n*7);render()}
function resetTaskPeriod(){dayFocus=today();render()}
tasksPage=function(){
 const daily=taskPeriodMode==='today';
 const wd=weekDates(dayFocus),start=daily?dayFocus:wd[0],end=daily?dayFocus:wd[6];
 const arr=getTasks(start,end);
 const filtered=taskFilter==='all'?arr:taskFilter==='pending'?arr.filter(x=>!completed(x)):arr.filter(x=>x.course===taskFilter);
 const label=daily?`${pretty(dayFocus)} · ${['월','화','수','목','금','토','일'][weekday(dayFocus)]}요일`:`${pretty(wd[0])} – ${pretty(wd[6])}`;
 const switcher=`<div class="task-period-switch" role="group" aria-label="할 일 표시 기간"><button class="${daily?'active':''}" aria-pressed="${daily}" onclick="chooseTaskPeriod('today')">오늘의 할 일</button><button class="${!daily?'active':''}" aria-pressed="${!daily}" onclick="chooseTaskPeriod('week')">주간 할 일</button></div>`;
 return header('Tasks','오늘 할 일과 주간 계획을 전환해 확인하세요. 완료 기록은 날짜별로 유지됩니다.')+`<section class="panel"><div class="task-period-header">${switcher}<button class="action smallbtn" onclick="openModal('${dayFocus}')">+ 새 할 일</button></div><div class="task-period-navigation"><button class="action ghost smallbtn" aria-label="이전 ${daily?'날짜':'주'}" onclick="shiftTaskPeriod(-1)">←</button><b>${label}</b><button class="action ghost smallbtn" aria-label="다음 ${daily?'날짜':'주'}" onclick="shiftTaskPeriod(1)">→</button><button class="action secondary smallbtn" onclick="resetTaskPeriod()">오늘로 이동</button></div><div class="row between" style="margin:19px 0 9px"><span class="muted small">${arr.filter(completed).length}/${arr.length} 완료</span><span class="muted small">${progress(arr)}%</span></div>${bar(progress(arr))}<div class="tabs section">${[['all','전체'],['pending','미완료'],...courseMeta.map(x=>[x[0],x[1]])].map(x=>`<button class="${taskFilter===x[0]?'selected':''}" onclick="filterTasks('${x[0]}')">${x[1]}</button>`).join('')}</div>${daily?`<div class="tasks">${listHTML(filtered)}</div>`:wd.map(s=>{const ts=filtered.filter(x=>x.date===s);return `<div class="weekly-day">${['월','화','수','목','금','토','일'][weekday(s)]}요일 · ${pretty(s)} ${s===today()?'· 오늘':''}</div><div class="tasks">${listHTML(ts)}</div>`}).join('')}</section>`;
};


// v2.7: shared course registry + asynchronous lecture timetable entries.
if(!Array.isArray(state.extraCourses))state.extraCourses=[];
for(const c of state.extraCourses){if(!courseMeta.some(x=>x[0]===c[0]))courseMeta.push(c)}
function newCourse(){
 const name=prompt('새 과목 이름을 입력하세요');if(name===null||!name.trim())return;
 const cleaned=name.trim();
 if(courseMeta.some(c=>c[1].replace(/\s/g,'').toLowerCase()===cleaned.replace(/\s/g,'').toLowerCase())){alert('이미 등록된 과목입니다. 과목 목록에서 선택해주세요.');return}
 const id='added_'+Date.now().toString(36),row=[id,cleaned,0,'#96A8BC'];
 state.extraCourses.push(row);courseMeta.push(row);save();
 if(document.getElementById('modal')?.classList.contains('open')){
  const select=$('newCourse');select.innerHTML=courseMeta.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('');select.value=id;
 }
 render();
 alert('과목이 추가되었습니다. 할 일, 과목 필터, 자료실에서도 선택할 수 있습니다.');
}
const _openCourseModal=openModal;
openModal=function(date){_openCourseModal(date);const field=$('newCourse');if(field){field.innerHTML=courseMeta.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('');if(taskFilter!=='all'&&taskFilter!=='pending'&&courseMeta.some(c=>c[0]===taskFilter))field.value=taskFilter;}}
const _taskEditV27=editTask;
editTask=function(uid){_taskEditV27(uid);const t=findTask(uid);if(t)$('newCourse').value=t.course;}
const _tasksPageV27=tasksPage;
tasksPage=function(){let html=_tasksPageV27();return html.replace('>+ 새 할 일</button>','>+ 새 할 일</button><button class="action secondary smallbtn" onclick="newCourse()">+ 과목 추가</button>')};
const _originalTimePageV27=timetablePage;
timetablePage=function(){
 const html=_originalTimePageV27();
 const start=monday(classFocus),end=add(start,6);
 const lectures=[{id:'logic',name:'논리적 사고',release:add(start,0),deadline:end,detail:'매주 월요일 강의 공개 · 일요일 23:59까지 시청'}];
 const online=`<section class="panel section" aria-label="이번 주 온라인 강의"><div class="row between" style="align-items:center;flex-wrap:wrap;gap:10px"><h2 style="margin:0">이번 주 온라인 강의</h2><span class="badge">정해진 강의실·수업 시간 없음</span></div><p class="sub small" style="margin-top:10px">온라인 수업은 시간표의 특정 시각에 배치하지 않고, 공개일과 마감일로 관리합니다.</p>${lectures.map(l=>`<div class="material-entry online-course-row"><div><b>${esc(l.name)}</b><br><small class="muted">${pretty(l.release)} 공개 · ${pretty(l.deadline)} 마감</small><br><small class="muted">${esc(l.detail)}</small></div><div class="row" style="flex-wrap:wrap"><button class="action secondary smallbtn" onclick="openJournal('${l.id}','${l.release}')">강의 기록 →</button><button class="action ghost smallbtn" onclick="go('tasks','${l.id}')">할 일 보기 →</button></div></div>`).join('')}</section>`;
 return html.replace('<section class="panel section"><div class="row between" style="flex-wrap:wrap;gap:12px"><div><h2 style="margin:0">내 시간표 편집</h2>', online+'<section class="panel section"><div class="row between" style="flex-wrap:wrap;gap:12px"><div><h2 style="margin:0">내 시간표 편집</h2>');
};
// Include online-only subjects and newly registered subjects in archive and material filters.
uniqueCourses=function(){const found=new Map();for(const c of classSchedule){const id=c.courseId||c.id;if(!found.has(id))found.set(id,{...c,id})}for(const c of courseMeta){if(c[0]==='other')continue;if(!found.has(c[0]))found.set(c[0],{id:c[0],name:c[1]})}return [...found.values()]};
const _journalPageV27=journalPage;
journalPage=function(){let html=_journalPageV27();if(journalKey){const[id,date]=journalKey.split('@');if(id==='logic')html=html.replace('logic · ', '논리적 사고 · ');}return html;};
const _archiveResultsV27=archiveResultsHTML;
archiveResultsHTML=function(list){return _archiveResultsV27(list).replace(/ · logic</g,' · 논리적 사고<')};
const _settingsV27=settingsPage;
settingsPage=function(){return _settingsV27()+`<section class="panel section" style="max-width:740px"><h2>과목 관리</h2><p class="sub">할 일과 자료실에서 공통으로 사용하는 과목 목록입니다.</p>${courseMeta.filter(c=>c[0]!=='other').map(c=>`<div class="material-entry"><b>${esc(c[1])}</b><small class="muted">${c[0].startsWith('added_')?'사용자 추가 과목':'기본 과목'}</small></div>`).join('')}<button class="action secondary" onclick="newCourse()">+ 과목 추가</button></section>`};

applyTheme();

render();
</script></body></html>
