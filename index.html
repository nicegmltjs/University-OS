<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#edf5ef"><title>University OS</title>
<style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#243a2e;background:#f5f8f5;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#ecf4ed;padding:30px 18px;border-right:1px solid #dbe9de}.brand{font-weight:800;font-size:21px;margin:0 8px 32px}.nav{width:100%;display:block;text-align:left;border:0;background:transparent;border-radius:11px;padding:13px;margin:4px 0;color:#52705c}.nav.active{background:#d8e9dc;color:#24583a;font-weight:700}.main{padding:35px max(22px,5vw);max-width:1300px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#748a7a}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{border:1px solid #dfe9e1;background:#fff;padding:20px;border-radius:17px;margin:12px 0}.card h3{margin:0 0 12px}.btn{border:0;border-radius:10px;background:#427b58;color:white;padding:10px 15px}.btn.alt{background:#e5f0e7;color:#335d40}.btn.warn{background:#f9ebeb;color:#963e3e}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field input,.field select,.field textarea{border:1px solid #cbdccf;padding:11px;border-radius:9px;width:100%;background:white;color:#243a2e}.field textarea{min-height:90px}.item{border-bottom:1px solid #edf1ec;padding:11px 0;display:flex;align-items:center;gap:12px;justify-content:space-between}.item:last-child{border:0}.item>div{min-width:0;overflow-wrap:anywhere}.tag{display:inline-block;font-size:11px;background:#e7f0e9;padding:5px 8px;border-radius:7px}.error{color:#ab3737}.success{color:#29734a}.notice{background:#eaf4ed;padding:15px;border-radius:12px;line-height:1.7}.hidden{display:none!important}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{border:1px solid #dae7df;background:#fff;padding:8px;min-height:70px;border-radius:8px;font-size:11px;overflow:hidden}.day strong{display:block;font-size:13px}.day.today{border:2px solid #427b58}.full{width:100%}#auth{min-height:100vh;display:grid;place-items:center;padding:24px}#auth .card{width:min(420px,100%)}@media(max-width:720px){.shell{display:block}.sidebar{display:flex;align-items:center;gap:7px;overflow:auto;padding:12px;position:sticky;top:0;z-index:5}.brand{font-size:14px;margin:0 12px 0 0;white-space:nowrap}.nav{white-space:nowrap;width:auto;padding:9px}.main{padding:18px}.calendar-grid{gap:2px}.day{padding:3px;min-height:58px;font-size:9px}}[data-theme=rose]{--accent:#a85480}[data-theme=peach]{--accent:#ae704a}[data-theme=lavender]{--accent:#7e6cb3}[data-theme=blue]{--accent:#4276a4}[data-theme=mono]{--accent:#555}body{--accent:#427b58}body[data-theme] .btn:not(.alt):not(.warn){background:var(--accent)}body[data-dark=true]{background:#262e2a;color:#f1f5f0}body[data-dark=true] .sidebar{background:#303d35}body[data-dark=true] .card,body[data-dark=true] .day{background:#35443b;color:#f4f6f4;border-color:#526457}body[data-dark=true] .muted{color:#c1d1c5}

.course-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;align-items:end}
.course-form .field{margin:4px 0}.meeting-line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;padding:4px 0}
.meeting-line .btn{font-size:11px;padding:5px 8px}
.tt-scroll{width:100%;overflow-x:auto}.tt-layout{display:grid;grid-template-columns:55px repeat(7,minmax(110px,1fr));min-width:825px;gap:4px}
.tt-day{text-align:center;height:38px;display:grid;place-items:center;background:#edf4ef;border-radius:7px 7px 0 0;font-weight:700}
.tt-time-lane,.tt-lane{position:relative;background:repeating-linear-gradient(to bottom,transparent 0px,transparent 63px,#dde9df 63px,#dde9df 64px)}
.tt-hour{position:absolute;left:0;transform:translateY(-40%);font-size:11px;color:#718777}
.tt-event{position:absolute;left:3px;right:3px;border-radius:8px;padding:6px 8px;overflow:hidden;color:#263e31;border-left:3px solid #6a9a78;box-shadow:0 1px 2px #0001;z-index:1;overflow-wrap:anywhere}
.tt-event b{display:block;font-size:12px;line-height:1.3}.tt-event small{display:block;font-size:10px;margin-top:2px}
</style></head><body><div id="auth"></div><div id="app" class="shell hidden"><aside class="sidebar"><div class="brand">✳ University OS</div><nav id="nav"></nav></aside><main class="main"><div class="top"><div><small id="eyebrow" class="muted"></small><h1 id="heading">My University</h1></div><div class="actions"><span id="plan" class="tag">FREE</span><button class="btn alt" id="logout">로그아웃</button></div></div><div id="content"></div><p class="muted" style="font-size:11px">University OS · 사용자별 데이터 저장 · 베타</p></main></div>
<script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
