name: University OS regression tests
on:
  push:
    branches: [feature/multiuser-freemium]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all regression suites
        run: node --test tests/backup-validation.test.cjs tests/calendar-events.test.cjs tests/schedule-recurrence.test.cjs tests/persistence-regression.test.cjs tests/cloud-save.test.cjs
      - name: Check production and demo JavaScript syntax
        run: |
          node --check --input-type=module < app.js
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('demo.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No inline demo script found');
          for (const [, code] of scripts) new vm.Script(code);
          console.log('Demo JavaScript syntax OK');
          NODE

      - name: Install Chromium browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run mobile Chromium smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/uos-http.log 2>&1 &
          node tests/browser-smoke.cjs
