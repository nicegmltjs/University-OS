<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#edf5ef"><title>University OS — Demo</title>
<style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#243a2e;background:#f5f8f5;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#ecf4ed;padding:30px 18px;border-right:1px solid #dbe9de}.brand{font-weight:800;font-size:21px;margin:0 8px 32px}.nav{width:100%;display:block;text-align:left;border:0;background:transparent;border-radius:11px;padding:13px;margin:4px 0;color:#52705c}.nav.active{background:#d8e9dc;color:#24583a;font-weight:700}.main{padding:35px max(22px,5vw);max-width:1300px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#748a7a}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{border:1px solid #dfe9e1;background:#fff;padding:20px;border-radius:17px;margin:12px 0}.card h3{margin:0 0 12px}.btn{border:0;border-radius:10px;background:#427b58;color:white;padding:10px 15px}.btn.alt{background:#e5f0e7;color:#335d40}.btn.warn{background:#f9ebeb;color:#963e3e}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field input,.field select,.field textarea{border:1px solid #cbdccf;padding:11px;border-radius:9px;width:100%;background:white;color:#243a2e}.field textarea{min-height:90px}.item{border-bottom:1px solid #edf1ec;padding:11px 0;display:flex;align-items:center;gap:12px;justify-content:space-between}.item:last-child{border:0}.item>div{min-width:0;overflow-wrap:anywhere}.tag{display:inline-block;font-size:11px;background:#e7f0e9;padding:5px 8px;border-radius:7px}.error{color:#ab3737}.success{color:#29734a}.notice{background:#eaf4ed;padding:15px;border-radius:12px;line-height:1.7}.hidden{display:none!important}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{border:1px solid #dae7df;background:#fff;padding:8px;min-height:70px;border-radius:8px;font-size:11px;overflow:hidden}.day strong{display:block;font-size:13px}.day.today{border:2px solid #427b58}.full{width:100%}#auth{min-height:100vh;display:grid;place-items:center;padding:24px}#auth .card{width:min(420px,100%)}@media(max-width:720px){.shell{display:block}.sidebar{display:flex;align-items:center;gap:7px;overflow:auto;padding:12px;position:sticky;top:0;z-index:5}.brand{font-size:14px;margin:0 12px 0 0;white-space:nowrap}.nav{white-space:nowrap;width:auto;padding:9px}.main{padding:18px}.calendar-grid{gap:2px}.day{padding:3px;min-height:58px;font-size:9px}}[data-theme=rose]{--accent:#a85480}[data-theme=peach]{--accent:#ae704a}[data-theme=lavender]{--accent:#7e6cb3}[data-theme=blue]{--accent:#4276a4}[data-theme=mono]{--accent:#555}body{--accent:#427b58}body[data-theme] .btn:not(.alt):not(.warn){background:var(--accent)}body[data-dark=true]{background:#262e2a;color:#f1f5f0}body[data-dark=true] .sidebar{background:#303d35}body[data-dark=true] .card,body[data-dark=true] .day{background:#35443b;color:#f4f6f4;border-color:#526457}body[data-dark=true] .muted{color:#c1d1c5}
</style></head><body><div id="auth"></div><div id="app" class="shell hidden"><aside class="sidebar"><div class="brand">✳ University OS</div><nav id="nav"></nav></aside><main class="main"><div class="top"><div><small id="eyebrow" class="muted"></small><h1 id="heading">My University</h1></div><div class="actions"><span id="plan" class="tag">FREE</span><button class="btn alt" id="logout">로그아웃</button></div></div><div id="content"></div><p class="muted" style="font-size:11px">University OS · 사용자별 데이터 저장 · 베타</p></main></div>
<script>window.UNIVERSITY_OS_CONFIG={paymentEnabled:false,priceKrw:7900};</script><script>
const cfg=window.UNIVERSITY_OS_CONFIG||{};
const $=id=>document.getElementById(id);
const safe=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const defaults=()=>({settings:{semester:"",start:"",end:"",theme:"sage",dark:false},courses:[],tasks:[],journals:[],materials:[]});
const caps={journals:20};
let supa=null,user={id:"demo",email:"demo@example.com"},plan="free",workspace=defaults(),page="home",busy=false;
const isPro=()=>plan==="pro";
const uid=()=>crypto.randomUUID();
const cur=()=>new Date().toLocaleDateString("sv-SE");
function message(text,type="error"){const el=$("message");if(el){el.textContent=text;el.className=type;}}
function authView(){const ready=!!(cfg.supabaseUrl&&cfg.supabaseAnonKey);
 $("app").classList.add("hidden");$("auth").classList.remove("hidden");
 $("auth").innerHTML='<div class="card"><h1>✳ University OS</h1><p class="muted">나만의 대학 생활을 한곳에서 관리하세요.</p>'+(ready?'<form id="authform"><label class="field">이메일<input id="email" type="email" required autocomplete="email"></label><label class="field">비밀번호<input id="password" type="password" minlength="6" required autocomplete="current-password"></label><div class="actions"><button class="btn" type="submit" value="login">로그인</button><button class="btn alt" type="button" id="signup">회원가입</button></div></form><p class="muted">회원가입 시 이메일 확인이 필요할 수 있습니다.</p>':'<p class="notice">아직 서비스 설정이 완료되지 않았습니다. 운영자가 Supabase 연결 정보를 등록하면 회원가입과 로그인을 이용할 수 있습니다.</p>')+'<p id="message" aria-live="polite"></p></div>';
 if(!ready)return;
 $("authform").onsubmit=async e=>{e.preventDefault();await authenticate(false);};
 $("signup").onclick=()=>authenticate(true);
}
async function authenticate(create){const email=$("email").value.trim(),password=$("password").value;
 if(!email||password.length<6){message("이메일과 6자 이상 비밀번호를 입력해 주세요.");return;}
 const {error}=create?await supa.auth.signUp({email,password}):await supa.auth.signInWithPassword({email,password});
 if(error){message(error.message);return;}
 if(create){message("가입 요청이 접수되었습니다. 이메일 인증이 설정돼 있다면 메일을 확인해 주세요.","success");return;}
 await enter();
}
async function enter(){const {data:{user:u}}=await supa.auth.getUser();user=u;if(!user){authView();return;}
 const {data:space,error}=await supa.from("workspaces").select("data").eq("user_id",user.id).maybeSingle();
 if(error){authView();message("데이터 조회 실패: "+error.message);return;}
 workspace=space?.data&&Array.isArray(space.data.courses)?space.data:defaults();
 const {data:ent, error:entError}=await supa.from("entitlements").select("plan,expires_at").eq("user_id",user.id).maybeSingle();
 if(entError){authView();message("구독 상태를 확인할 수 없습니다.");return;}
 plan=ent?.plan==="pro"&&(!ent.expires_at||new Date(ent.expires_at)>new Date())?"pro":"free";
 $("auth").classList.add("hidden");$("app").classList.remove("hidden");render();
}
async function persist(){localStorage.setItem("uos-demo-v1",JSON.stringify(workspace));return true;}
const limits=(k)=>isPro()||!(k in caps)?"무제한":caps[k];
const atLimit=k=>!isPro()&&(k in caps)&&workspace[k].length>=caps[k];
function gate(k){if(atLimit(k)){alert("FREE "+({courses:"과목",tasks:"과제",journals:"강의 기록",materials:"자료"}[k])+"은 최대 "+caps[k]+"개입니다. PRO에서 제한을 해제할 수 있습니다.");page="plans";render();return false;}return true;}
function nav(){return [["home","홈"],["courses","과목·시간표"],["tasks","과제·시험"],["journals","강의 기록"],["materials","자료실"],["calendar","캘린더"],["settings","설정"],["plans","요금제"]].map(([k,t])=>'<button class="nav '+(k===page?'active':'')+'" data-page="'+k+'">'+t+'</button>').join("");}
function title(t,sub){$("heading").textContent=t;$("eyebrow").textContent=sub||"";}
function courseName(id){return workspace.courses.find(x=>x.id===id)?.name||"기타";}
const choices=(selected)=>'<option value="">과목 선택</option>'+workspace.courses.map(c=>'<option value="'+safe(c.id)+'" '+(selected===c.id?'selected':'')+'>'+safe(c.name)+'</option>').join("");
const action=(name,id,label,warning=false)=>'<button class="btn '+(warning?'warn':'alt')+'" data-action="'+name+'" data-id="'+safe(id)+'">'+label+'</button>';
function render(){
 document.body.dataset.theme=workspace.settings.theme||"sage";document.body.dataset.dark=!!workspace.settings.dark;
 $("nav").innerHTML=nav();$("plan").textContent=isPro()?"PRO":"FREE";
 const pages={home,courses,tasks,journals,materials,calendar,settings,plans};
 $("content").innerHTML='<div class="notice"><b>미리보기 모드</b> · 회원가입/결제 없이 기능을 체험할 수 있습니다. 입력한 내용은 현재 브라우저에만 저장됩니다. <button class="btn alt" id="demoToggle">' +(isPro()?"FREE로 보기":"PRO로 보기")+'</button></div>'+(pages[page]||home)();
}
function home(){title("My University","오늘의 학업 현황");const due=workspace.tasks.filter(x=>!x.done&&x.date>=cur()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
 return '<div class="cards"><div class="card"><h3>이번 학기</h3><p>'+safe(workspace.settings.semester||"학기를 설정해 주세요")+'</p></div><div class="card"><h3>등록한 과목</h3><p>'+workspace.courses.length+'개</p></div><div class="card"><h3>미완료 과제</h3><p>'+workspace.tasks.filter(x=>!x.done).length+'개</p></div></div><section class="card"><h3>가까운 마감</h3>'+ (due.map(t=>'<div class="item"><div><b>'+safe(t.title)+'</b><p class="muted">'+safe(t.date)+' · '+safe(courseName(t.course_id))+'</p></div>'+action("toggle",t.id,"완료")+'</div>').join("")||'<p class="muted">등록된 일정이 없습니다.</p>')+'</section><div class="actions"><button class="btn" data-page="tasks">+ 과제 등록</button><button class="btn alt" data-page="courses">과목 설정</button></div>';}
function courses(){title("과목 및 시간표","개인별 자유 설정");return '<section class="card"><h3>과목 등록 · '+workspace.courses.length+'/'+limits("courses")+'</h3><form id="courseForm" class="actions"><input name="name" required maxlength="60" placeholder="과목명" aria-label="과목명"><input name="room" placeholder="강의실 (선택)" aria-label="강의실"><button class="btn">추가</button></form></section><section class="card"><h3>내 시간표</h3>'+(workspace.courses.map(c=>'<div class="item"><div><b>'+safe(c.name)+'</b><p class="muted">'+safe(c.room||"강의실 미설정")+' · '+safe((c.meetings||[]).map(m=>["일","월","화","수","목","금","토"][m.day]+" "+m.start+"~"+m.end).join(", ")||"시간 미설정")+'</p></div><div class="actions">'+action("meeting",c.id,"수업 시간")+action("editcourse",c.id,"수정")+action("delcourse",c.id,"삭제",true)+'</div></div>').join("")||'<p class="muted">과목을 자유롭게 추가해 주세요.</p>')+'</section>';}
function tasks(){title("과제 및 시험","할 일과 마감 관리");return '<section class="card"><h3>새 일정 · '+workspace.tasks.length+'/'+limits("tasks")+'</h3><form id="taskForm"><div class="field"><label>제목<input name="title" required maxlength="120"></label></div><div class="cards"><label class="field">과목<select name="course_id">'+choices()+'</select></label><label class="field">마감일<input name="date" type="date" required value="'+cur()+'"></label><label class="field">구분<select name="kind"><option value="task">과제</option><option value="exam">시험</option></select></label></div><button class="btn">일정 추가</button></form></section><section class="card"><h3>등록한 일정</h3>'+ (workspace.tasks.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>'<div class="item"><div><b style="'+(t.done?'text-decoration:line-through':'')+'">'+safe(t.title)+'</b><p class="muted">'+safe(t.date)+' · '+safe(courseName(t.course_id))+' · '+(t.kind==="exam"?"시험":"과제")+'</p></div><div class="actions">'+action("toggle",t.id,t.done?"미완료":"완료")+action("edittask",t.id,"수정")+action("deltask",t.id,"삭제",true)+'</div></div>').join("")||'<p class="muted">아직 등록한 일정이 없습니다.</p>')+'</section>';}
function journals(){title("Lecture Journal","수업 기록과 복습");return '<section class="card"><h3>강의 기록 · '+workspace.journals.length+'/'+limits("journals")+'</h3><form id="journalForm"><div class="cards"><label class="field">과목<select name="course_id">'+choices()+'</select></label><label class="field">날짜<input name="date" type="date" required value="'+cur()+'"></label></div><label class="field">제목<input name="title" maxlength="100" required></label><label class="field">내용<textarea name="body" required></textarea></label><button class="btn">기록 저장</button></form></section><section class="card"><h3>내 기록</h3>'+workspace.journals.slice().reverse().map(j=>'<div class="item"><div><b>'+safe(j.title)+'</b><p class="muted">'+safe(j.date)+' · '+safe(courseName(j.course_id))+'</p><p style="white-space:pre-wrap">'+safe(j.body)+'</p></div><div class="actions">'+action("editjournal",j.id,"수정")+action("deljournal",j.id,"삭제",true)+'</div></div>').join("")+'</section>';}
function materials(){title("Materials","자료 링크 모아보기");return '<section class="card"><h3>자료 링크 · '+workspace.materials.length+'/'+limits("materials")+'</h3><form id="materialForm"><label class="field">자료명<input name="title" required maxlength="120"></label><label class="field">링크<input name="url" type="url" required placeholder="https://"></label><label class="field">과목<select name="course_id">'+choices()+'</select></label><button class="btn">자료 등록</button></form></section><section class="card"><h3>자료실</h3>'+workspace.materials.map(m=>'<div class="item"><div><b>'+safe(m.title)+'</b><p class="muted">'+safe(courseName(m.course_id))+'</p><a target="_blank" rel="noopener noreferrer" href="'+safe(m.url)+'">자료 열기</a></div><div class="actions">'+action("editmaterial",m.id,"수정")+action("delmaterial",m.id,"삭제",true)+'</div></div>').join("")+'</section>';}
function calendar(){title("Calendar","날짜별 일정");const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1),last=new Date(now.getFullYear(),now.getMonth()+1,0),days=Array.from({length:(first.getDay()+6)%7},()=>'<div></div>');for(let d=1;d<=last.getDate();d++){const date=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');days.push('<div class="day '+(date===cur()?'today':'')+'"><strong>'+d+'</strong>'+workspace.tasks.filter(t=>t.date===date).map(t=>'<div>'+safe(t.title)+'</div>').join("")+'</div>')}return '<section class="card"><h3>'+now.getFullYear()+'년 '+(now.getMonth()+1)+'월</h3><div class="calendar-grid">'+["월","화","수","목","금","토","일"].map(x=>'<b>'+x+'</b>').join("")+days.join("")+'</div></section>';}
function settings(){title("설정","학기·개인화·데이터");return '<section class="card"><h3>내 학기</h3><form id="settingsForm"><label class="field">학기 이름<input name="semester" required value="'+safe(workspace.settings.semester)+'" placeholder="예: 2027년 1학기"></label><div class="cards"><label class="field">시작일<input type="date" name="start" value="'+safe(workspace.settings.start)+'"></label><label class="field">종료일<input type="date" name="end" value="'+safe(workspace.settings.end)+'"></label></div><label class="field">테마<select name="theme">'+["sage","rose","peach","lavender","blue","mono"].filter(x=>isPro()||["sage","mono"].includes(x)).map(x=>'<option '+(workspace.settings.theme===x?'selected':'')+' value="'+x+'">'+({sage:"Sage Mint",rose:"Soft Rose",peach:"Peach Cream",lavender:"Misty Lavender",blue:"Cloud Blue",mono:"Monotone"}[x])+'</option>').join("")+'</select></label><label><input type="checkbox" name="dark" '+(workspace.settings.dark?'checked':'')+'> 다크 모드</label><p><button class="btn">설정 저장</button></p></form></section><section class="card"><h3>데이터 백업</h3><p class="muted">내 데이터를 JSON 파일로 저장합니다. 중요한 기록은 별도로 보관하세요.</p><div class="actions"><button class="btn alt" id="export">JSON 내보내기</button><label class="btn alt" for="importfile">JSON 가져오기</label><input type="file" id="importfile" accept="application/json" hidden></div></section><section class="card"><h3>계정</h3><p class="muted">'+safe(user?.email)+'</p><button class="btn warn" id="deleteaccount">계정 삭제 요청 안내</button></section>';}
function plans(){title("FREE / PRO","내게 맞는 이용 방식");return '<div class="cards"><section class="card"><h2>FREE · 0원</h2><p>과목·시간표·과제·시험·자료 링크 무제한 · 강의 기록 20개</p><p>테마 2개 · 백업/복원 제공</p></section><section class="card"><h2>PRO · 학기당 '+Number(cfg.priceKrw||7900).toLocaleString('ko-KR')+'원</h2><p>모든 항목 개수 제한 해제 · 테마 6종</p><button class="btn" id="checkout" '+(!cfg.paymentEnabled?'disabled':'')+'>PRO 구매</button><p class="muted">'+(cfg.paymentEnabled?"결제 페이지로 이동합니다.":"결제 서비스 설정 후 구매할 수 있습니다.")+'</p></section></div>';}
async function change(kind,entry,del=false){const prev=structuredClone(workspace);if(del)workspace[kind]=workspace[kind].filter(x=>x.id!==entry.id);else workspace[kind].push(entry);
 if(!(await persist())){workspace=prev;}render();}
document.addEventListener("click",async e=>{
 const pg=e.target.closest("[data-page]");if(pg){page=pg.dataset.page;render();return;}
 const el=e.target.closest("[data-action]");if(!el)return;const act=el.dataset.action,id=el.dataset.id;
 const kind=act.includes("course")?"courses":act.includes("task")||act==="toggle"?"tasks":act.includes("journal")?"journals":"materials";
 const item=workspace[kind]?.find(x=>x.id===id);if(!item)return;
 if(act==="toggle"){item.done=!item.done;if(!(await persist()))item.done=!item.done;render();return;}
 if(act==="meeting"){const day=prompt("요일 (0=일, 1=월, ..., 6=토)","1"),start=prompt("시작 시간 (HH:MM)","09:00"),end=prompt("종료 시간 (HH:MM)","10:15");if(day===null||start===null||end===null)return;if(!/^[0-6]$/.test(day)||!/^\d\d:\d\d$/.test(start)||!/^\d\d:\d\d$/.test(end)||end<=start){alert("요일 또는 시간 형식을 확인하세요.");return;}item.meetings=[...(item.meetings||[]),{day:Number(day),start,end}];await persist();render();return;}
 if(act.startsWith("del")){if(!confirm("정말 삭제할까요?"))return;await change(kind,item,true);return;}
 if(act.startsWith("edit")){const field=kind==="journals"?"body":kind==="materials"?"title":kind==="tasks"?"title":"name";const value=prompt("수정할 "+field,item[field]);if(value===null||!value.trim())return;const old=item[field];item[field]=value.trim();if(!(await persist()))item[field]=old;render();}
});
document.addEventListener("submit",async e=>{const form=e.target;if(!["courseForm","taskForm","journalForm","materialForm","settingsForm"].includes(form.id))return;
 e.preventDefault();const values=Object.fromEntries(new FormData(form).entries());
 if(form.id==="settingsForm"){const old=structuredClone(workspace.settings);workspace.settings={...workspace.settings,...values,dark:!!form.elements.dark.checked};if(!isPro()&&!["sage","mono"].includes(workspace.settings.theme))workspace.settings.theme="sage";if(!(await persist()))workspace.settings=old;render();return;}
 const kind=({courseForm:"courses",taskForm:"tasks",journalForm:"journals",materialForm:"materials"})[form.id];if(!gate(kind))return;
 if(kind==="materials"&&!/^https?:\/\//.test(values.url)){alert("http 또는 https 링크만 등록할 수 있습니다.");return;}
 await change(kind,{id:uid(),...values,...(kind==="courses"?{meetings:[]}:{}),...(kind==="tasks"?{done:false}:{})});});
document.addEventListener("click",async e=>{
 if(e.target.id==="demoReset"){if(confirm("데모에 입력한 데이터를 모두 초기화할까요?")){localStorage.removeItem("uos-demo-v1");workspace=defaults();plan="free";localStorage.setItem("uos-demo-plan","free");render();}} if(e.target.id==="demoToggle"){plan=isPro()?"free":"pro";localStorage.setItem("uos-demo-plan",plan);render();}
 if(e.target.id==="export"){const blob=new Blob([JSON.stringify({version:2,data:workspace},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="university-os-backup.json";a.click();URL.revokeObjectURL(url);}
